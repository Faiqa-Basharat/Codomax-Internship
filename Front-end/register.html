<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectMatch - Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f8f4;
      --card: #ffffff;
      --ink: #1c2420;
      --muted: #5b625d;
      --border: #e3e3dc;
      --green: #75876f;
      --green-dark: #66785f;
      --error: #b3402f;
      --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .auth-card {
      width: 100%;
      max-width: 462px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 36px 32px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 22px;
    }
    h1 {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 10px;
    }
    .intro { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    .field { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
    input {
      width: 100%;
      height: 41px;
      padding: 0 14px;
      font-family: inherit;
      font-size: 14px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 5px;
    }
    input::placeholder { color: #80857f; }
    input:focus { outline: 2px solid rgba(117, 135, 111, 0.35); border-color: var(--green); }
    input[aria-invalid="true"] { border-color: var(--error); }
    .error { color: var(--error); font-size: 12px; margin-top: 6px; min-height: 0; }
    .error:empty { display: none; }

    .submit {
      width: 100%;
      height: 40px;
      margin-top: 6px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .submit:hover { background: var(--green-dark); }
    .submit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .switch {
      border-top: 1px solid var(--border);
      margin-top: 24px;
      padding-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .switch a { color: var(--muted); font-weight: 600; margin-left: 4px; text-decoration: none; }
    .switch a:hover { color: var(--ink); text-decoration: underline; }

    @media (max-width: 480px) { .auth-card { padding: 28px 22px 26px; } }
  </style>
</head>
<body>

  <main class="auth-card">
    <p class="eyebrow">Join ProjectMatch</p>
    <h1>Create your student account</h1>
    <p class="intro">Connect with student project leads, find collaborators, and showcase your skills.</p>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Jordan Lee" autocomplete="name">
        <p class="error" id="name-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="name@university.edu" autocomplete="email">
        <p class="error" id="email-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password (min. 6 characters)" autocomplete="new-password">
        <p class="error" id="password-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password">
        <p class="error" id="confirm-error" role="alert"></p>
      </div>

      <button type="submit" class="submit">Register Now</button>
    </form>

    <p class="switch">Already have an account? <a href="login.html">Log In</a></p>
  </main>

  <script>
    var form = document.getElementById('signup-form');
    var fields = ['name', 'email', 'password', 'confirm'];

    function setError(id, message) {
      var input = document.getElementById(id);
      document.getElementById(id + '-error').textContent = message;
      input.setAttribute('aria-invalid', message ? 'true' : 'false');
    }

    function getUsers() {
      try { return JSON.parse(localStorage.getItem('pm_users')) || []; }
      catch (e) { return []; }
    }

    function validate() {
      var name = form.name.value.trim();
      var email = form.email.value.trim().toLowerCase();
      var password = form.password.value;
      var confirm = form.confirm.value;
      var ok = true;

      setError('name', name.length < 2 ? 'Please enter your full name.' : '');
      if (name.length < 2) ok = false;

      var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      var taken = getUsers().some(function (u) { return u.email === email; });
      var emailMsg = !emailOk ? 'Please enter a valid email address.'
                   : taken ? 'An account with this email already exists. Try logging in.' : '';
      setError('email', emailMsg);
      if (emailMsg) ok = false;

      setError('password', password.length < 6 ? 'Password must be at least 6 characters.' : '');
      if (password.length < 6) ok = false;

      var confirmMsg = !confirm ? 'Please re-enter your password.'
                     : confirm !== password ? 'Passwords do not match.' : '';
      setError('confirm', confirmMsg);
      if (confirmMsg) ok = false;

      return ok;
    }

    // clear an error as soon as the person starts fixing it
    fields.forEach(function (id) {
      document.getElementById(id).addEventListener('input', function () { setError(id, ''); });
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!validate()) {
        var firstBad = form.querySelector('[aria-invalid="true"]');
        if (firstBad) firstBad.focus();
        return;
      }

      var user = {
        name: form.name.value.trim().replace(/\s+/g, ' '),
        email: form.email.value.trim().toLowerCase(),
        password: form.password.value   // demo only: a real site must never store passwords in the browser
      };

      var users = getUsers();
      users.push(user);
      localStorage.setItem('pm_users', JSON.stringify(users));
      localStorage.setItem('pm_currentUser', JSON.stringify({ name: user.name, email: user.email }));

      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
